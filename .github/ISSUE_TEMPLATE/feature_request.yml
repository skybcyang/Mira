name: 场景与建议 / Feature request
description: 描述你希望完成的工作与目前的阻碍
body:
  - type: textarea
    id: problem
    attributes:
      label: 你在做什么，卡在哪里？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望的结果与验收方式
      description: 哪个具体变化会让这项工作更容易完成？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已试过的做法
