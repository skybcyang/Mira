name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm build:bridge
      - run: git diff --check
      - name: Keep workspace data out of source control
        shell: bash
        run: |
          tracked=$(git ls-files -- boards-v2 runs-v2 workflows-v2 board-checkpoints-v1 inspiration-pool-v2.json .mira-workspace.lock reference archive mockups showcase-materials docs/superpowers attachments migration-backups purged-boards-v2 .env '.env.*' '*.pem' '*.key' '*.p12' '*.pfx' ':!.env.example')
          if [ -n "$tracked" ]; then
            echo "Remove local data or secret configuration from this change before merging."
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history without exposing matches
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100'

  required:
    name: CI required
    needs: [checks, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: test "$CHECKS_RESULT" = success && test "$SECRETS_RESULT" = success
